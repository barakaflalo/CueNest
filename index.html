<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="CueNest — ביליארד וסנוקר: 8 כדורים, 9 כדורים וסנוקר. לבד, מול המחשב, בשניים או אונליין">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CueNest</title>
<style>:root{--bg:#0b0b0d;--bg2:#15151a;--card:#1b1b22;--card2:#24242e;--fg:#f4efe3;--muted:#9a95a6;--acc:#e8b84a;--acc2:#ffd877;--line:#34343f;--good:#59d28a;--bad:#ff6b6b;--on-acc:#1a1405;--r:16px}
:root[data-mode=day]{--bg:#f4efe6;--bg2:#ebe4d6;--card:#fffdf8;--card2:#f1eadc;--fg:#231f17;--muted:#7a7262;--line:#d9cfba;--on-acc:#fff;--good:#1f9d63;--bad:#c42f45}
:root[data-theme=gold]{--acc:#e8b84a;--acc2:#ffd877}:root[data-theme=gold][data-mode=day]{--acc:#b8860b;--acc2:#8c6508}
:root[data-theme=silver]{--acc:#c9d1dc;--acc2:#e6ebf2;--on-acc:#10141c}:root[data-theme=silver][data-mode=day]{--acc:#5d6b7e;--acc2:#3f4b5c;--on-acc:#fff}
:root[data-theme=emerald]{--acc:#4fd18b;--acc2:#8cebb6;--on-acc:#05200f}:root[data-theme=emerald][data-mode=day]{--acc:#1f9d63;--acc2:#157348;--on-acc:#fff}
:root[data-theme=ruby]{--acc:#ff6b7a;--acc2:#ff9aa5;--on-acc:#2b0610}:root[data-theme=ruby][data-mode=day]{--acc:#c42f45;--acc2:#9b2236;--on-acc:#fff}
:root[data-theme=ocean]{--acc:#5aaeff;--acc2:#9bcdff;--on-acc:#04122b}:root[data-theme=ocean][data-mode=day]{--acc:#1f78c8;--acc2:#165a96;--on-acc:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 70% at 15% 0%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),radial-gradient(90% 60% at 100% 100%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.sc{display:none;flex:1;min-height:0;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom));overflow-y:auto}
.sc.on{display:flex;animation:scIn .18s ease-out}
@keyframes scIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{flex:1;margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.ib{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:22px;cursor:pointer}
.ib:active,.btn:active,.tile:active,.lv:active{transform:scale(.96)}
.back{display:flex;align-items:center;gap:6px;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--acc);background:var(--card);color:var(--acc);font-weight:700;cursor:pointer;font-size:16px}
.btn{min-height:56px;padding:12px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.sm{min-height:48px;font-size:15px;padding:8px 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.brand{text-align:center;padding:10px 0 4px}
.brand .logo{font-size:44px;line-height:1}
.brand h2{margin:6px 0 2px;font-size:30px;font-weight:900;color:var(--acc);letter-spacing:.5px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{position:relative;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--card));padding:14px 12px 12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;overflow:hidden}
.tile .art{width:100%;height:84px;display:grid;place-items:center;font-size:52px}
.tile .art svg,.tile .art canvas{max-width:100%;max-height:84px}
.tile b{font-size:17px;text-align:center}
.tile small{color:var(--muted);font-size:12px;text-align:center}
.who{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-top:4px}
.who .av{font-size:30px}
.foot{margin-top:auto;padding-top:14px;text-align:center;color:var(--muted);font-size:12px}
.modes{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.modes .btn{justify-content:flex-start;text-align:start;min-height:68px}
.modes .btn .ic{font-size:30px;width:40px;text-align:center}
.modes .btn small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.modes .btn.pri small{color:var(--on-acc);opacity:.75}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}
.wh{font-weight:800;color:var(--acc);margin:12px 0 0;font-size:15px}
.lv{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;font-weight:800;cursor:pointer;min-height:68px}
.lv .st{font-size:13px;letter-spacing:1px;color:var(--acc);min-height:16px}
.lv.lock{opacity:.35;pointer-events:none}
.lv.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.row{display:flex;gap:10px;align-items:center}
.lbl{color:var(--muted);font-size:13px;margin:12px 2px 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:48px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.seg button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
input.txt{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;padding:0 14px;outline:none}
input.txt:focus{border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;animation:scIn .15s}
.ov .box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:420px;width:100%;max-height:88vh;overflow:auto;text-align:center}
.ov h3{margin:0 0 8px;font-size:22px}
.ov p{color:var(--muted);margin:6px 0 14px;line-height:1.5}
.ov .btn{width:100%;margin-top:10px}
.big-st{font-size:40px;letter-spacing:6px;color:var(--acc);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;max-width:86vw;text-align:center;animation:scIn .15s}
/* ---- משחק ---- */
#play{position:relative;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px}
.hud{display:flex;align-items:center;gap:8px;min-height:44px}
.hud .ib{width:46px;height:46px;font-size:20px}
.hud .stat{flex:1;display:flex;justify-content:space-around;font-weight:800;direction:ltr}
.hud .stat span small{display:block;color:var(--muted);font-weight:500;font-size:11px;text-align:center}
.stage{flex:1;min-height:0;display:flex;gap:8px;align-items:stretch;direction:ltr}
.col{display:flex;flex-direction:column;gap:8px;width:30%;max-width:130px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;place-items:center}
.panel canvas{width:100%;display:block}
.boardwrap{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
.boardwrap canvas{max-width:100%;max-height:100%;border-radius:10px;border:1px solid var(--line);touch-action:none}
.pend{position:absolute;inset-inline-start:-1px;bottom:0;width:7px;background:var(--bad);border-radius:4px;transition:height .12s;height:0}
.ctrl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.ctrl button{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:26px;cursor:pointer;touch-action:none}
.ctrl button:active,.ctrl button.dn{background:var(--acc);color:var(--on-acc)}
.voice{display:flex;gap:8px;align-items:center;direction:ltr}
.voice button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;touch-action:none;font-size:15px}
.voice button.dn{background:var(--good);color:#06200f}
.talking{color:var(--good);font-weight:700;font-size:13px}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:900;color:var(--acc);text-shadow:0 4px 24px #000;pointer-events:none;z-index:5}
/* שניים בטלפון: שוכב */
.two{flex-direction:row!important}
.two .side{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.hint{color:var(--muted);font-size:13px;text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--muted)}
.wrap-lobby{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.code{font-size:44px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--acc);direction:ltr}
.seats .card{display:flex;align-items:center;gap:10px}
.seats .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.seats .dot.on{background:var(--good)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.brand .logo{font-size:30px}.tile{min-height:120px}.tile .art{height:60px;font-size:38px}}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:ltr}
.strip .panel{padding:3px;border-radius:10px}
.oppcol{width:74px;flex:none}
.oppcol .panel{padding:4px 3px}
.two .side .panel{border-radius:10px}

.two .side{justify-content:flex-end}
.two .boardwrap{flex:none}
.two .ctrl{grid-template-columns:1fr 1fr}
.two .ctrl button{min-height:clamp(52px,8.5vh,84px)}
.two .ctrl [data-k=ccw]{order:1}.two .ctrl [data-k=cw]{order:2}.two .ctrl [data-k=left]{order:3}.two .ctrl [data-k=right]{order:4}.two .ctrl [data-k=drop]{order:5;grid-column:1/3}

/* ---- מעטפת AppNest: בית, כלים, הגדרות, אודות, אלבום ---- */
.hero{position:relative;text-align:center;padding:6px 0 4px}
.hero .me{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 14px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px}
.hero .me .av{font-size:26px}
.hero .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.quick{display:flex;gap:8px}.quick button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:21px;cursor:pointer}
.wordmark{font-size:36px;font-weight:900;letter-spacing:.5px;margin-top:6px}.wordmark i{font-style:normal;color:var(--acc)}
.sub{color:var(--muted);font-size:14px}
.floaty{display:flex;justify-content:center;gap:14px;font-size:26px;opacity:.85;margin-top:4px}
.dailyb{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;border-radius:var(--r);border:1px solid var(--acc);background:linear-gradient(120deg,var(--card2),var(--card));cursor:pointer;padding:10px 14px;text-align:start;margin-top:10px}
.dailyb .ic{font-size:34px}.dailyb b{display:block;font-size:17px}.dailyb small{color:var(--muted);font-size:13px}
.dailyb.done{border-color:var(--good)}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:8px;direction:ltr}
.week i{flex:1;text-align:center;font-style:normal;font-size:11px;color:var(--muted);padding:6px 0;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.week i.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:800}.week i.today{border-color:var(--acc)}
.resume{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);cursor:pointer;padding:8px 14px;margin-top:10px;text-align:start;font-weight:700}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
.tools button{min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;cursor:pointer}
.tools button i{font-style:normal;font-size:26px}
.badge{text-align:center;color:var(--muted);font-size:12px;padding:6px 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:4px 0}
.sw small{display:block;color:var(--muted);font-size:12px}
.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc)}
.card h3{margin:0 0 10px;font-size:16px}
.card+.card{margin-top:10px}
.avs{display:flex;flex-wrap:wrap;gap:8px}.avs button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:28px;cursor:pointer}.avs button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat3 b{display:block;font-size:22px;color:var(--acc)}.stat3 span{font-size:12px;color:var(--muted)}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stk button{min-height:96px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;padding:6px;opacity:.38;filter:grayscale(1)}
.stk button.got{opacity:1;filter:none;border-color:var(--acc)}.stk button i{font-style:normal;font-size:34px}
.rules h2{margin:14px 0 6px;font-size:18px;color:var(--acc)}.rules p{margin:6px 0;line-height:1.55}
.gbig{font-size:64px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}
.linkbtn{text-decoration:none;color:inherit}

/* רקעים למשחקים */
:root[data-mode=day] :root[data-mode=day] :root[data-mode=day] :root[data-mode=day] #play{background-size:cover;background-position:center}
#play .hud .stat,#play .tdhud{text-shadow:0 1px 3px rgba(0,0,0,.45);color:#fff}
:root[data-mode=day] #play .hud .stat,:root[data-mode=day] #play .tdhud{color:#1b2b20;text-shadow:none}
.tile .art img{width:100%;height:100%;object-fit:contain;display:block}
.tile .art{flex:0 0 auto;height:92px;margin-bottom:4px}
.tile b,.tile small{position:relative;z-index:1}
:root[data-mode=day] #play .hint{background:rgba(10,20,30,.55);color:#fff;border-radius:14px;padding:8px 12px;align-self:center}
#play .hint:empty{display:none}
#play .hud .stat{background:rgba(10,20,30,.45);border-radius:14px;padding:4px 14px}
#play .hud .stat small{color:#dfe8ee}
:root[data-mode=day] :root[data-mode=day] 
:root[data-mode=day] :root[data-mode=day] :root[data-mode=day] :root[data-mode=day] :root[data-mode=day] :root[data-mode=day] :root[data-mode=day] 
#play[data-bg=pen]{background:linear-gradient(180deg,#27406a,#2f5d86 40%,#3d8a55)}
#play[data-bg=hoop]{background:linear-gradient(180deg,#26335a,#3b4f86 45%,#a96d33)}
#play[data-bg=dart]{background:linear-gradient(180deg,#2a1f33,#3a2a46 50%,#25303f)}
#play[data-bg=box]{background:linear-gradient(180deg,#1b1f33,#3a3350 50%,#34406a)}
#play[data-bg=snk]{background:linear-gradient(180deg,#2a1a12,#3a2316 50%,#1d140e)}
.pen-views{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.pen-views .pv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pen-views.duo .pv.top canvas{transform:rotate(180deg)}
.pen-views canvas{max-width:100%;max-height:100%;border-radius:14px;border:1px solid var(--line);touch-action:none}

/* ---- CueNest: מסך המשחק ---- */
#play{padding:0!important;gap:0!important;overflow:hidden!important;background:#0a0f0c;position:relative}
#play .cvs{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#play .hud{position:absolute;top:calc(4px + env(safe-area-inset-top));left:6px;right:6px;display:flex;align-items:center;gap:6px;z-index:3;pointer-events:none;direction:ltr;min-height:0}
#play .hud>*{pointer-events:auto}
#play .hud .ib{width:40px;height:40px;font-size:18px;background:rgba(10,14,12,.74);border-color:rgba(255,255,255,.18);color:#fff;flex:none}
.cards{flex:1;display:flex;gap:6px;justify-content:center;min-width:0;direction:ltr}
.pc{display:flex;align-items:center;gap:6px;min-width:0;flex:1;max-width:250px;padding:3px 8px;border-radius:12px;background:rgba(10,14,12,.74);border:1px solid rgba(255,255,255,.14);color:#fff;min-height:40px}
.pc.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.pc .av{font-size:20px;flex:none}.pc .in{min-width:0;flex:1}
.pc b{display:block;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sub{font-size:11px;color:#c9c4d6;min-height:12px;line-height:1.1}
.pc .big{font-size:24px;font-weight:900;color:var(--acc2);flex:none}
.chips{display:flex;gap:2px;flex-wrap:wrap;margin-top:1px}
.bc{display:inline-block;width:15px;height:15px;border-radius:50%;background:var(--c);color:#fff;font:700 8px/15px system-ui;text-align:center;font-style:normal;box-shadow:inset -2px -2px 3px rgba(0,0,0,.4),inset 1px 1px 2px rgba(255,255,255,.55);text-shadow:0 0 2px #000}
.bc.st{background:linear-gradient(#f5f1e4 0 24%,var(--c) 24% 76%,#f5f1e4 76%)}
.bc.off{opacity:.22}.bc.hi{outline:2px solid var(--acc);outline-offset:1px}
.status{position:absolute;top:calc(48px + env(safe-area-inset-top));left:60px;right:60px;text-align:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000,0 0 8px #000;pointer-events:none;z-index:2;min-height:16px}
.p9row{position:absolute;top:calc(68px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:4px;pointer-events:none;z-index:2}
.p9row .bc{width:21px;height:21px;font-size:11px;line-height:21px}
.banner{position:absolute;left:0;right:0;top:32%;display:grid;place-items:center;pointer-events:none;z-index:4}
.banner .b{max-width:82%;padding:10px 22px;border-radius:16px;background:rgba(10,14,12,.86);border:2px solid var(--acc);color:#fff;text-align:center;animation:bpop .25s ease-out}
.banner .b.foul{border-color:var(--bad)}.banner .b.good{border-color:var(--good)}.banner .b.info{border-color:#8cc8ff}
.banner b{display:block;font-size:22px}.banner small{display:block;font-size:13px;color:#ffd0c8;margin-top:2px}
@keyframes bpop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.pwr{position:absolute;right:6px;top:calc(100px + env(safe-area-inset-top));bottom:calc(10px + env(safe-area-inset-bottom));width:54px;z-index:3;display:flex;flex-direction:column;align-items:center;touch-action:none;padding:0 12px}
.pwr.left{right:auto;left:6px}
.pwr .trk{position:relative;flex:1;width:28px;border-radius:14px;background:linear-gradient(180deg,rgba(40,120,60,.35),rgba(150,60,30,.45));border:1px solid rgba(255,255,255,.3)}
.pwr .fill{position:absolute;top:0;left:0;right:0;height:0;border-radius:14px;opacity:.9;background:#7be07b}
.pwr .knob{position:absolute;left:-7px;right:-7px;height:16px;top:0;margin-top:-8px;border-radius:8px;background:#fff;box-shadow:0 2px 8px #000;border:2px solid var(--acc)}
.pwr small{display:none}

<script>
const ART_FILES = ["snk-cue","snk-felt","snk-wood","tile-p8","tile-p9","tile-snk","tile-snk6"];
/* ===== src/nestlink.js ===== */
/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null, seen: {}, hb: {}, hbT: null };
    let S = null;                                         // the session — owned and persisted by the game
    const ev = (k, ...a) => { try { opt[k] && opt[k](...a); } catch (e) { console.error(e); } };
    const persist = () => ev('persist', S);
    const roomId = c => (opt.app || 'nest') + '-v1-' + c.toLowerCase();
    const max = () => opt.maxPlayers || 2;
    const isHost = () => S && S.role === 'host';
    function peerOpts() {
      const q = new URLSearchParams(location.search), o = { debug: 0, config: { iceServers: opt.iceServers || ICE } };
      if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = '/'; o.secure = false; }   // test servers only
      return o;
    }
    function setStatus(st, err) { L.status = st; if (err !== undefined) L.lastErr = err; ev('onStatus', st, L.lastErr); }
    const link = seat => S.links[seat] || (S.links[seat] = { seq: 0, lastIn: 0, out: [] });
    const rosterEntry = seat => S.roster.find(p => p.seat === seat);
    function rawTo(seat, m) { const c = L.conns[seat]; try { if (c && c.open) c.send(m); } catch (e) {} }
    function rawAll(m, except) { for (const s in L.conns) if (+s !== except) rawTo(+s, m); }

    /* ---------- starting ---------- */
    async function start(session) {
      close(true); S = session; persist();
      L.hbT = setInterval(beat, 3000);                   // after close(), which clears it
      setStatus('connecting');
      if (!(await loadPeer())) { setStatus('error', 'load'); return false; }
      const peer = L.peer = new Peer(isHost() ? roomId(S.code) : undefined, peerOpts());
      peer.on('open', id => {
        S.pid = id; if (isHost()) { const me = rosterEntry(0); if (me) { me.pid = id; me.online = true; } }
        persist(); setStatus(isHost() ? 'waiting' : 'connecting'); if (!isHost()) connectHost();
      });
      peer.on('connection', c => { if (isHost()) attach(c, null); });
      peer.on('call', onCall);
      peer.on('disconnected', () => setTimeout(() => { try { if (L.peer === peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
      peer.on('error', e => {
        const t = e && e.type;
        if (t === 'unavailable-id') {                     // room id still held (e.g. after reload) — new code while nobody joined, else retry
          if (S.roster.length < 2) { S.code = genCode(); persist(); ev('onCode', S.code); }
          setTimeout(() => start(S), S.roster.length < 2 ? 300 : 4000); return;
        }
        if (t === 'peer-unavailable') { setStatus('notfound', 'nf'); scheduleRetry(); return; }
        if (/network|server-error|socket/.test(t || '')) setStatus('error', 'net');
      });
      return true;
    }
    function host(code) {
      return start({ role: 'host', code: code || genCode(), seat: 0, cid: uid(), roster: [{ seat: 0, name: opt.name ? opt.name() : '', online: true, cid: null, voice: false }], links: {} });
    }
    function join(code) { return start({ role: 'guest', code: code.toUpperCase(), seat: null, cid: uid(), roster: [], links: {} }); }
    function resume(session) { return start(session); }
    function scheduleRetry() { clearTimeout(L.retry); if (S && !isHost() && !(L.conns[0] && L.conns[0].open)) L.retry = setTimeout(connectHost, 3000); }
    function connectHost() { if (!L.peer || L.peer.destroyed || (L.conns[0] && L.conns[0].open)) return; attach(L.peer.connect(roomId(S.code), { reliable: true, serialization: 'json' }), 0); scheduleRetry(); }

    /* ---------- connections ---------- */
    function attach(c, seat) {
      let mySeat = seat;                                  // the seat at the other end of this connection
      const onOpen = () => {
        if (!isHost()) { L.conns[0] = c; rawTo(0, { t: 'hi', cid: S.cid, name: opt.name ? opt.name() : '', have: link(0).lastIn, v: opt.version, hb: 1 }); }
      };
      if (c.open) onOpen(); else c.on('open', onOpen);
      c.on('data', m => {
        if (!m || !m.t) return;
        const key = isHost() ? mySeat : 0;                // 1.1 heartbeat: remember when we last heard from them
        if (key != null) L.seen[key] = Date.now();
        if (m.t === 'ping') { if (key != null) L.hb[key] = 1; return; }
        if (isHost() && m.t === 'hi') {                   // a guest introduces itself → give it a seat (same seat when it comes back)
          let p = S.roster.find(x => x.cid === m.cid);
          if (!p) {
            if (S.roster.length >= max()) { try { c.send({ t: 'full' }); c.close(); } catch (e) {} return; }
            let s = 1; while (S.roster.some(x => x.seat === s)) s++;
            p = { seat: s, cid: m.cid, name: '', online: true, voice: false }; S.roster.push(p); S.roster.sort((a, b) => a.seat - b.seat);
            ev('onJoin', s);
          }
          mySeat = p.seat; p.name = (m.name || '').slice(0, 20); p.online = true; p.pid = c.peer;
          if ((m.have || 0) > link(mySeat).seq) link(mySeat).seq = m.have;   // 1.1: we restored an older session — keep numbering after what they already got
          if (L.conns[mySeat] && L.conns[mySeat] !== c) { try { L.conns[mySeat].close(); } catch (e) {} }
          L.conns[mySeat] = c; L.seen[mySeat] = Date.now(); L.hb[mySeat] = m.hb ? 1 : 0;   // 1.1 phones announce the heartbeat
          rawTo(mySeat, { t: 'hi', seat: mySeat, have: link(mySeat).lastIn, roster: S.roster, v: opt.version, hb: 1 });
          link(mySeat).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(mySeat, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          persist(); broadcastRoster(); setStatus('open'); callEveryone();
          return;
        }
        if (!isHost() && m.t === 'hi') {
          S.seat = m.seat; S.roster = m.roster || []; L.seen[0] = Date.now(); L.hb[0] = m.hb ? 1 : 0;
          if ((m.have || 0) > link(0).seq) link(0).seq = m.have;            // 1.1: same protection on the guest side
          persist();
          link(0).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(0, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          clearTimeout(L.retry); setStatus('open'); ev('onRoster', S.roster); callEveryone(); return;
        }
        if (m.t === 'full') { setStatus('full', 'full'); close(true); return; }
        onData(m, isHost() ? mySeat : 0);
      });
      const gone = () => {
        if (isHost()) { if (mySeat == null || L.conns[mySeat] !== c) return; delete L.conns[mySeat]; const p = rosterEntry(mySeat); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { if (L.conns[0] !== c) return; delete L.conns[0]; setStatus('reconnecting'); scheduleRetry(); }
        stopAudioFrom(mySeat);
      };
      c.on('close', gone); c.on('error', gone);
    }
    function broadcastRoster() { if (!isHost()) return; rawAll({ t: 'roster', roster: S.roster }); ev('onRoster', S.roster); }

    /* ---------- messages ---------- */
    function onData(m, via) {
      if (m.t === 'roster') { S.roster = m.roster; persist(); ev('onRoster', S.roster); callEveryone(); return; }
      if (m.t === 'need') { link(via).out.filter(x => x.seq > m.have).forEach(x => rawTo(via, x)); return; }
      if (m.t === 'emo' || m.t === 'talk' || m.t === 'vm') {
        if (isHost()) rawAll(m, via);                     // relay to the other guests
        if (m.t === 'emo') ev('onEmoji', m.e, m.from);
        else if (m.t === 'talk') { const p = rosterEntry(m.from); if (p) p.talking = m.on; ev('onTalk', m.from, m.on); }
        else gotChunk(m);
        return;
      }
      if (m.t === 'voice') { const p = rosterEntry(m.from); if (p) p.voice = m.on; if (isHost()) { rawAll(m, via); broadcastRoster(); } callEveryone(); return; }
      if (m.t !== 'm') return;
      const lk = link(via);
      if (m.seq <= lk.lastIn) return;
      if (m.seq > lk.lastIn + 1) { rawTo(via, { t: 'need', have: lk.lastIn }); return; }
      lk.lastIn = m.seq; persist();
      if (isHost() && max() > 2 && !m.p) for (const p of S.roster) if (p.seat !== 0 && p.seat !== m.from) seqTo(p.seat, m.d, m.from);
      ev('onMessage', m.d, m.from);
    }
    function seqTo(seat, d, from, priv) {
      const lk = link(seat), m = { t: 'm', seq: ++lk.seq, from, d }; if (priv) m.p = 1;
      lk.out.push(m); if (lk.out.length > 300) lk.out.splice(0, lk.out.length - 300);
      rawTo(seat, m);
    }
    function send(d) {                                    // reliable, ordered, reaches every other player
      if (!S) return;
      if (isHost()) { for (const p of S.roster) if (p.seat !== 0) seqTo(p.seat, d, 0); }
      else seqTo(0, d, S.seat);
      persist();
    }
    function sendTo(seat, d) {                            // private: host → one guest, or guest → host only (not relayed)
      if (!S || seat === S.seat) return;
      if (isHost()) { if (S.roster.some(p => p.seat === seat)) seqTo(seat, d, 0, true); }
      else seqTo(0, d, S.seat, true);
      persist();
    }
    function emoji(e) { if (S) rawAll({ t: 'emo', e, from: S.seat }); }
    const isOpen = () => !!S && (isHost() ? Object.values(L.conns).some(c => c.open) : !!(L.conns[0] && L.conns[0].open));

    /* ---------- voice: push-to-talk / open mic (direct mesh) ---------- */
    async function micOn() {
      if (L.mic) return true;
      try { L.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { ev('onMicError', e && e.name); return false; }
      L.mic.getAudioTracks().forEach(t => t.enabled = L.openMic);
      const me = rosterEntry(S.seat); if (me) me.voice = true;
      const m = { t: 'voice', on: true, from: S.seat }; rawAll(m);
      callEveryone(); return true;
    }
    function callEveryone() {                             // each phone with a mic sends its own one-way audio call to every other phone
      if (!L.mic || !L.peer || !S) return;
      for (const p of S.roster) {
        if (p.seat === S.seat || !p.online || !p.pid) continue;
        const c = L.calls[p.seat]; if (c && !c._dead) continue;
        try { const call = L.peer.call(p.pid, L.mic, { metadata: { seat: S.seat } }); L.calls[p.seat] = call; call.on('close', () => { call._dead = true; }); call.on('error', () => { call._dead = true; }); } catch (e) {}
      }
    }
    function onCall(call) {
      call.answer();                                      // receive only — our own audio goes out on our own call
      call.on('stream', st => {
        const seat = call.metadata && call.metadata.seat;
        let a = L.audio[seat]; if (!a) { a = L.audio[seat] = document.createElement('audio'); a.autoplay = true; a.setAttribute('playsinline', ''); a.style.display = 'none'; document.body.appendChild(a); }
        a.srcObject = st; const p = a.play(); if (p && p.catch) p.catch(() => ev('onAudioBlocked'));
      });
    }
    function stopAudioFrom(seat) { const a = L.audio[seat]; if (a) { a.srcObject = null; a.remove(); delete L.audio[seat]; } const c = L.calls[seat]; if (c) { try { c.close(); } catch (e) {} delete L.calls[seat]; } }
    async function talk(on) {
      if (on && !(await micOn())) return false;
      if (!L.mic) return false;
      L.talking = on || L.openMic; L.mic.getAudioTracks().forEach(t => t.enabled = L.talking);
      rawAll({ t: 'talk', on: L.talking, from: S.seat }); return true;
    }
    async function setOpenMic(on) { L.openMic = on; if (on && !(await micOn())) { L.openMic = false; return false; } return talk(on); }

    /* ---------- voice messages ---------- */
    async function recStart(maxSec) {
      if (L.rec || !(await micOn())) return false;
      const track = L.mic.getAudioTracks()[0].clone(); track.enabled = true;
      const st = new MediaStream([track]), mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      let r; try { r = new MediaRecorder(st, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : undefined); } catch (e) { ev('onMicError', 'rec'); return false; }
      const parts = [], t0 = Date.now();
      L.rec = { r, track, t0, timer: setTimeout(() => recStop(), (maxSec || 20) * 1000) };
      r.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
      r.onstop = async () => {
        track.stop();
        const dur = Math.round((Date.now() - t0) / 100) / 10, blob = new Blob(parts, { type: r.mimeType || mime || 'audio/webm' });
        if (L.rec && L.rec.cancel || dur < .4 || !blob.size) { L.rec = null; ev('onRecState', false); return; }
        L.rec = null; ev('onRecState', false);
        const data = b64(await blob.arrayBuffer()), id = uid(), CH = 12000, n = Math.ceil(data.length / CH);
        for (let i = 0; i < n; i++) rawAll({ t: 'vm', id, i, n, dur, mime: blob.type, from: S.seat, data: data.slice(i * CH, (i + 1) * CH) });
        ev('onVoiceMsg', URL.createObjectURL(blob), dur, S.seat, true);
      };
      r.start(); ev('onRecState', true, t0); return true;
    }
    function recStop(cancel) { if (!L.rec) return; clearTimeout(L.rec.timer); L.rec.cancel = !!cancel; try { L.rec.r.stop(); } catch (e) {} }
    function gotChunk(m) {
      const c = L.chunks[m.id] || (L.chunks[m.id] = { parts: [], got: 0, t: Date.now() });
      if (c.parts[m.i] == null) { c.parts[m.i] = m.data; c.got++; }
      if (c.got === m.n) { delete L.chunks[m.id]; const blob = new Blob([unb64(c.parts.join(''))], { type: m.mime || 'audio/webm' }); ev('onVoiceMsg', URL.createObjectURL(blob), m.dur, m.from, false); }
      for (const k in L.chunks) if (Date.now() - L.chunks[k].t > 60000) delete L.chunks[k];
    }

    /* ---------- 1.1 heartbeat ----------
       A phone that closes the app or loses signal often never fires 'close'. Every 3 s we ping
       everyone; a peer that pings (1.1+) but has been silent for 10 s is treated as gone.
       Peers on 1.0 never ping, so they are never dropped by mistake. */
    function beat() {
      if (!S) return;
      const now = Date.now();
      for (const k in L.conns) {
        const s = +k; rawTo(s, { t: 'ping' });
        if (!L.hb[s] || now - (L.seen[s] || now) < 10000) continue;
        L.hb[s] = 0; const c = L.conns[s]; delete L.conns[s]; try { c.close(); } catch (e) {}
        stopAudioFrom(s);
        if (isHost()) { const p = rosterEntry(s); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { setStatus('reconnecting'); scheduleRetry(); }
      }
    }

    /* ---------- closing ---------- */
    function close(keepSession) {
      clearTimeout(L.retry); clearInterval(L.hbT); L.hbT = null;
      Object.keys(L.audio).forEach(s => stopAudioFrom(+s));
      for (const s in L.conns) { try { L.conns[s].close(); } catch (e) {} }
      L.conns = {};
      if (L.mic) { L.mic.getTracks().forEach(t => t.stop()); L.mic = null; }
      L.calls = {}; L.talking = false;
      try { if (L.peer) L.peer.destroy(); } catch (e) {}
      L.peer = null; if (!keepSession) S = null; setStatus('off');
    }

    return {
      host, join, resume, close, send, sendTo, emoji, isOpen, talk, setOpenMic, recStart, recStop,
      get status() { return L.status; }, get error() { return L.lastErr; }, get session() { return S; },

      ru_p8: '<p>Fifteen object balls and a cue ball. After the break the table is "open": the first ball legally potted decides who plays solids (1–7) and who plays stripes (9–15). To win, pot all your balls and then the 8.</p><p>Every shot must first hit one of your own balls, and then some ball must reach a cushion or be potted. If not, or if the cue ball goes in, or you hit the other group first, it is a foul and your opponent gets the cue ball in hand anywhere on the table. Potting one of your balls lets you keep shooting.</p><p>Pot the 8 early, or with a foul, and you lose the game.</p>',
      ru_p9: '<p>Nine numbered balls. You must always hit the lowest numbered ball on the table first, but any ball legally potted counts, and the 9 potted legally wins the game, even in the middle of a run.</p><p>A foul (not hitting the lowest ball first, cue ball potted, no ball reaching a cushion) gives your opponent ball in hand. A 9 potted on a foul is spotted again. Three fouls in a row by the same player lose the game.</p>',
      ru_snk: '<p>22 balls: 15 reds (1 point) and the colours: yellow 2, green 3, brown 4, blue 5, pink 6, black 7. Pot a red, then a colour (which returns to the table), and so on. At the end the colours are potted in order from yellow to black.</p><p>A foul is worth at least 4 points to your opponent, up to 7 depending on the ball involved. After a foul that leaves the cue ball snookered behind a ball, your opponent gets a free ball. At the start, and after the cue ball is potted, you place it inside the D.</p><p>The player with more points at the end wins. A tie is decided on a re-spotted black. You can also concede.</p>',
      ru_snk6: '<p>Like snooker, but with only 6 reds. The game is shorter and quicker; the colours work the same, yellow 2 up to black 7. Same fouls and free-ball rule.</p>'
    },

      ru_p8: '<p>Пятнадцать прицельных шаров и биток. После разбоя стол «открыт»: первый правильно забитый шар решает, кто играет цельными (1–7), а кто полосатыми (9–15). Чтобы выиграть, забейте все свои шары, а затем чёрный (8).</p><p>Каждый удар должен сначала попасть в свой шар, и затем какой-то шар должен дойти до борта или упасть в лузу. Иначе, или если биток упал, или вы задели шар соперника первым — это фол, и соперник ставит биток куда угодно. Забили свой шар — бьёте дальше.</p><p>Чёрный, забитый раньше времени или с фолом, — поражение.</p>',
      ru_p9: '<p>Девять пронумерованных шаров. Всегда нужно сначала задеть младший по номеру шар на столе, но любой правильно забитый шар засчитывается, а правильно забитая девятка выигрывает партию, даже в середине серии.</p><p>Фол (не задели младший, биток в лузе, ни один шар не дошёл до борта) даёт сопернику шар в руке. Девятка, забитая с фолом, возвращается на стол. Три фола подряд от одного игрока — поражение.</p>',
      ru_snk: '<p>22 шара: 15 красных (1 очко) и цветные: жёлтый 2, зелёный 3, коричневый 4, синий 5, розовый 6, чёрный 7. Забиваете красный, затем цветной (он возвращается на стол) и так далее. В конце цветные забивают по порядку от жёлтого до чёрного.</p><p>Фол стоит сопернику минимум 4 очка, до 7 в зависимости от шара. Если после фола биток оказался в снукере за шаром, соперник получает свободный шар. В начале и после падения битка ставьте его внутри «D».</p><p>Побеждает тот, у кого больше очков. Ничья решается чёрным на месте. Можно и сдаться.</p>',
      ru_snk6: '<p>Как снукер, но всего с 6 красными. Партия короче и быстрее; цветные те же: жёлтый 2 … чёрный 7. Те же правила фолов и свободного шара.</p>'

      c_nofl: 'Blanca en lugar legal', c_play_ok: 'Blanca colocada',
      ru_p8: '<p>Quince bolas y la blanca. Tras la salida la mesa está «abierta»: la primera bola embocada legalmente decide quién juega lisas (1–7) y quién rayadas (9–15). Para ganar, emboca todas las tuyas y después la 8.</p><p>Cada tiro debe tocar primero una bola tuya y luego alguna bola debe llegar a banda o caer. Si no, o si entra la blanca, o tocas antes una bola del rival, es falta y el rival coloca la blanca donde quiera. Si embocas una tuya, sigues tirando.</p><p>La 8 embocada antes de tiempo, o con falta, pierde la partida.</p>',
      ru_p9: '<p>Nueve bolas numeradas. Siempre hay que tocar primero la bola más baja de la mesa, pero cualquier bola embocada legalmente cuenta, y la 9 embocada legalmente gana, incluso a mitad de una serie.</p><p>Una falta (no tocar primero la más baja, blanca embocada, ninguna bola a banda) da al rival bola en mano. Una 9 embocada con falta vuelve a la mesa. Tres faltas seguidas del mismo jugador pierden la partida.</p>',
      ru_snk: '<p>22 bolas: 15 rojas (1 punto) y los colores: amarilla 2, verde 3, marrón 4, azul 5, rosa 6, negra 7. Emboca una roja, luego un color (que vuelve a la mesa), y así sucesivamente. Al final los colores se embocan en orden, de la amarilla a la negra.</p><p>Una falta vale al menos 4 puntos para el rival, hasta 7 según la bola. Si tras una falta la blanca queda snookerada tras una bola, el rival tiene bola libre. Al inicio y tras embocar la blanca, se coloca dentro de la D.</p><p>Gana quien tenga más puntos. El empate se resuelve con la negra. También puedes rendirte.</p>',
      ru_snk6: '<p>Como el snooker, pero con solo 6 rojas. La partida es más corta y rápida; los colores valen igual, amarilla 2 hasta negra 7. Mismas faltas y regla de bola libre.</p>'
    },

let AC = null;

    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const SFX = {
  tap() { tone(520, 0.05, 'triangle', 0.05); },

  lock() { tone(150, 0.08, 'sine', 0.08); },
  line(n) { for (let i = 0; i < Math.min(4, n + 1); i++) tone(520 + i * 160, 0.12, 'triangle', 0.07, i * 0.06); },
  hit() { tone(110, 0.2, 'sawtooth', 0.06); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.08, i * 0.1)); },
  lose() { [330, 262, 196].forEach((f, i) => tone(f, 0.22, 'sawtooth', 0.05, i * 0.14)); },

      META.daily.done[dt.date] = 1; const y = dayKey(new Date(Date.now() - 864e5));
      META.daily.streak = META.daily.last === y ? META.daily.streak + 1 : 1; META.daily.last = dt.date; META.daily.best = Math.max(META.daily.best, META.daily.streak); fresh.push('daily');
    }

    const got = [], add = id => { if (!META.stk[id]) { META.stk[id] = Date.now(); got.push(id); } };
    const stars = totalStars();
    LGAMES.forEach(x => { if (doneOf(x) > 0) add('first_' + x); });
    if (stars >= 10) add('stars10'); if (stars >= 50) add('stars50'); if (stars >= 150) add('stars150');
    if (GAME_IDS.some(x => Object.values(pg(x).lv).some(s => s >= 3))) add('three');
    if ((c.cpu_w || 0) > 0) add('cpu'); if ((c.two || 0) > 0) add('two'); if ((c.online || 0) > 0) add('online');
    if (META.daily.last && Object.keys(META.daily.done).length) add('daily1'); if (META.daily.streak >= 3) add('streak3'); if (META.daily.streak >= 7) add('streak7');

    if (fresh.length) setTimeout(() => toast('📅 ' + T('daily_done'), 2400), 1500);
    if (got.length) setTimeout(() => toast('🏅 ' + got.map(id => T('st_' + id)).join(' · '), 3200), fresh.length ? 4200 : 1600);
  }
};

function exportBackup() {
  const data = { app: 'cuenest', v: APP_VERSION, by: S.name, date: new Date().toISOString(), settings: S, prog: P, meta: META };

  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'CueNest' }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(T('exported'));
}
function importBackup(f) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast(T('bad_file')); return; }
    if (!d || d.app !== 'cuenest' || !d.prog) { toast(T('bad_file')); return; }
    confirmBox(T('import_q', { n: d.by || '?', d: (d.date || '').slice(0, 10) }), () => { store.set('cn_set', d.settings || {}); store.set('cn_prog', d.prog || {}); store.set('cn_meta', d.meta || {}); location.reload(); });

  r.readAsText(f);
}
